---
layout: default
title: "{{ page.title }}"
---

<style>
    /* UKŁAD PORTALOWY DLA POJEDYNCZEGO NEWSA / BRIEFU */
    .post-container {
        max-width: 1200px;
        margin: 40px auto 60px auto;
        padding: 0 60px;
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 40px;
        align-items: start;
    }

    .news-article {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
    }
    .news-article::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: var(--accent-contrast);
    }

    .news-header {
        border-bottom: 1px dashed var(--border);
        padding-bottom: 25px;
        margin-bottom: 30px;
    }

    .news-category-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: var(--accent-contrast);
        background: rgba(255, 94, 0, 0.1);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid rgba(255, 94, 0, 0.2);
        text-transform: uppercase;
        font-weight: 800;
    }

    .news-title {
        font-size: 2.2rem;
        font-weight: 900;
        margin: 15px 0 20px 0;
        letter-spacing: -1px;
        line-height: 1.2;
        color: #fff;
    }

    .news-meta-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 15px;
    }

    /* PRZYCISKI UDOSTĘPNIANIA */
    .share-buttons {
        display: flex;
        gap: 10px;
    }
    .share-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-family: 'JetBrains Mono', monospace;
        text-decoration: none;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .share-btn:hover {
        background: rgba(0, 210, 255, 0.15);
        border-color: var(--accent-blue);
        color: var(--accent-blue);
    }

    /* TREŚĆ ARTYKUŁU ORAZ CZYSTE FORMATOWANIE ZDJĘĆ */
    .news-body {
        font-size: 1.05rem;
        color: #cbd5e1;
        line-height: 1.8;
    }
    .news-body h2, .news-body h3 {
        color: #fff;
        font-family: 'JetBrains Mono', monospace;
        margin-top: 40px;
        margin-bottom: 15px;
    }
    .news-body h2 { font-size: 1.4rem; border-left: 3px solid var(--accent-blue); padding-left: 10px; }
    .news-body p { margin-bottom: 20px; }
    .news-body a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
    .news-body a:hover { text-decoration: underline; }

    /* PROFESJONALNY WYGLĄD ZDJĘĆ W TREŚCI */
    .news-body img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin: 25px 0;
        display: block;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* SPIS TREŚCI (TOC) W BOCZNYM PANELU */
    .sidebar-toc {
        position: sticky;
        top: 90px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 25px;
        backdrop-filter: blur(10px);
    }
    .toc-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        color: #fff;
        margin: 0 0 15px 0;
        text-transform: uppercase;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
    }
    .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
    }
    .toc-item a {
        color: var(--text-muted);
        text-decoration: none;
        display: block;
        transition: 0.2s;
    }
    .toc-item a:hover {
        color: var(--accent-blue);
        transform: translateX(4px);
    }

    /* SEKCJA KOMENTARZY NA DOLE */
    .comments-section {
        margin-top: 50px;
        border-top: 1px dashed var(--border);
        padding-top: 35px;
    }
    .comments-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1rem;
        color: #fff;
        margin: 0 0 20px 0;
        text-transform: uppercase;
    }
    .comment-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 30px;
    }
    .comment-input, .comment-textarea {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border);
        color: #fff;
        padding: 12px 15px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        outline: none;
    }
    .comment-input:focus, .comment-textarea:focus { border-color: var(--accent-blue); }
    .comment-textarea { resize: vertical; min-height: 90px; }

    .comment-submit {
        background: rgba(0, 210, 255, 0.1);
        border: 1px solid rgba(0, 210, 255, 0.3);
        color: var(--accent-blue);
        padding: 10px 20px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        text-transform: uppercase;
        font-size: 0.8rem;
        align-self: flex-start;
    }
    .comment-submit:hover { background: var(--accent-blue); color: #000; }

    .user-comment {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    .user-comment-meta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: var(--accent-blue);
        margin-bottom: 4px;
    }
    .comment-actions {
        display: flex;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
    }
    .comment-action-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        padding: 2px 6px;
        border-radius: 4px;
        transition: 0.2s;
    }
    .comment-action-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .comment-action-btn.delete:hover { color: #ef4444; }

    @media (max-width: 1024px) {
        .post-container { grid-template-columns: 1fr; padding: 0 20px; }
        .sidebar-toc { position: static; }
    }
</style>

<div class="post-container">
    
    <!-- GŁÓWNA KOLUMNA ARTYKUŁU -->
    <article class="news-article">
        <header class="news-header">
            <span class="news-category-tag">[{{ page.category | default: "NEWS" | upcase }}]</span>
            <h1 class="news-title">{{ page.title }}</h1>
            
            <div class="news-meta-bar">
                <span>// Opublikowano: {{ page.date | date: "%Y.%m.%d" }}</span>
                <div class="share-buttons">
                    <a href="#" id="shareX" class="share-btn" target="_blank">𝕏 X (Twitter)</a>
                    <a href="#" id="shareFB" class="share-btn" target="_blank">f Facebook</a>
                </div>
            </div>
        </header>

        <!-- TREŚĆ WPISU Z JEKILLA (DYNAMIKA) -->
        <div class="news-body" id="articleBody">
            {{ content }}
        </div>

        <!-- SEKCJA KOMENTARZY -->
        <section class="comments-section">
            <h3 class="comments-title">// Komentarze & Opinie</h3>
            
            <div class="comment-form">
                <input type="text" id="commentAuthor" class="comment-input" placeholder="Twoje imię / nick...">
                <textarea id="commentText" class="comment-textarea" placeholder="Treść komentarza..."></textarea>
                <button class="comment-submit" id="commentSubmit">Dodaj komentarz</button>
            </div>

            <div id="commentsList"></div>
        </section>
    </article>

    <!-- BOCZNY PANEL: SPIS TREŚCI (TOC) -->
    <aside class="sidebar-toc">
        <h4 class="toc-title">// Spis Treści</h4>
        <ul class="toc-list" id="tocList"></ul>
    </aside>

</div>

<script>
    // AUTOMATYCZNY SPIS TREŚCI ZE STRUKTURY NAGŁÓWKÓW
    const articleBody = document.getElementById('articleBody');
    const tocList = document.getElementById('tocList');
    const headings = articleBody.querySelectorAll('h2, h3');

    if(headings.length === 0) {
        tocList.innerHTML = '<li style="color: var(--text-muted)">// Brak nagłówków</li>';
    } else {
        headings.forEach((heading, index) => {
            if(!heading.id) { heading.id = 'heading-' + index; }
            const li = document.createElement('li');
            li.className = 'toc-item';
            li.style.paddingLeft = heading.tagName === 'H3' ? '12px' : '0';
            li.innerHTML = `<a href="#${heading.id}">&rarr; ${heading.textContent}</a>`;
            tocList.appendChild(li);
        });
    }

    // PRZYCISKI UDOSTĘPNIANIA (TWITTER & FACEBOOK)
    const currentUrl = encodeURIComponent(window.location.href);
    const currentTitle = encodeURIComponent(document.title);
    document.getElementById('shareX').href = `https://twitter.com/intent/tweet?url=${currentUrl}&text=${currentTitle}`;
    document.getElementById('shareFB').href = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`;

    // SYSTEM KOMENTARZY (LOCALSTORAGE)
    const postId = window.location.pathname;
    const commentAuthor = document.getElementById('commentAuthor');
    const commentText = document.getElementById('commentText');
    const commentSubmit = document.getElementById('commentSubmit');
    const commentsList = document.getElementById('commentsList');

    let commentsKey = 'devlab_comments_' + postId;
    let savedComments = JSON.parse(localStorage.getItem(commentsKey)) || [];

    function renderComments() {
        commentsList.innerHTML = '';
        if(savedComments.length === 0) {
            commentsList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; font-family: \'JetBrains Mono\', monospace;">// Brak komentarzy. Bądź pierwszy!</div>';
            return;
        }

        savedComments.forEach((c, index) => {
            const div = document.createElement('div');
            div.className = 'user-comment';
            div.innerHTML = `
                <div>
                    <div class="user-comment-meta">// ${escapeHtml(c.author)} — ${c.date}</div>
                    <div style="color: #cbd5e1; font-size: 0.95rem; word-break: break-word;">${escapeHtml(c.text)}</div>
                </div>
                <div class="comment-actions">
                    <button class="comment-action-btn" onclick="editComment(${index})">Edytuj</button>
                    <button class="comment-action-btn delete" onclick="deleteComment(${index})">Usuń</button>
                </div>
            `;
            commentsList.appendChild(div);
        });
    }

    commentSubmit.addEventListener('click', () => {
        const author = commentAuthor.value.trim() || "Anonim";
        const text = commentText.value.trim();
        if(text.length < 2) return;

        const now = new Date();
        const dateStr = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');

        savedComments.push({ author, text, date: dateStr });
        localStorage.setItem(commentsKey, JSON.stringify(savedComments));
        
        commentText.value = '';
        renderComments();
    });

    window.deleteComment = function(index) {
        savedComments.splice(index, 1);
        localStorage.setItem(commentsKey, JSON.stringify(savedComments));
        renderComments();
    }

    window.editComment = function(index) {
        const current = savedComments[index];
        const newText = prompt("Edytuj treść komentarza:", current.text);
        if(newText !== null && newText.trim().length >= 2) {
            savedComments[index].text = newText.trim();
            localStorage.setItem(commentsKey, JSON.stringify(savedComments));
            renderComments();
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    renderComments();
</script>
