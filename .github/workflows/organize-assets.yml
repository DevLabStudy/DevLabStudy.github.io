name: Organize Assets

on:
  push:
    paths:
      - 'assets/images/**'

jobs:
  rename-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Rename Files
        run: |
          cd assets/images
          [ -f "IMG-20261028-WA0003.jpg" ] && mv "IMG-20261028-WA0003.jpg" "logo.jpg"
          [ -f "IMG-20261028-WA0007.jpg" ] && mv "IMG-20261028-WA0007.jpg" "banner.jpg"
          [ -f "media kit" ] && mv "media kit" "mediakit.pdf"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/
          git commit -m "Auto-rename uploaded assets" || exit 0
          git push
