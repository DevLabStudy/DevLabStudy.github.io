<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevLabStudy - Homelab documentation, Proxmox clusters, and Project Orbit.">
    <title>DevLabStudy | {{ page.title }}</title>
    
    <!-- Favicon w SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff5e00' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 17 10 11 4 5'></polyline><line x1='12' y1='19' x2='20' y2='19'></line></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-body: #030305; 
            --bg-nav: #030305; 
            --text-main: #f1f5f9; 
            --text-muted: #8b9bb4; 
            --border: rgba(0, 210, 255, 0.15); 
            --accent-blue: #00d2ff;
            --accent-contrast: #ff5e00;
            --card-bg: rgba(10, 15, 25, 0.6);
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #0b192c, var(--bg-body) 60%);
            background-color: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-attachment: fixed;
        }

        a { color: inherit; text-decoration: none; }

        /* NAVBAR - UKŁAD GRID (LOGO | LINKI | COMMUNITY) */
        .navbar { 
            background: var(--bg-nav); 
            border-bottom: 1px solid var(--border); 
            padding: 22px 50px; 
            display: grid; 
            grid-template-columns: auto 1fr auto; 
            align-items: center; 
            gap: 30px;
            position: sticky; 
            top: 0; 
            z-index: 1000;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-left { display: flex; align-items: center; }
        .nav-brand { 
            font-size: 1.3rem; 
            font-weight: 900; 
            text-decoration: none; 
            color: #fff; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .nav-brand svg { width: 22px; height: 22px; stroke: var(--accent-contrast); }
        
        /* MENU ŚRODKOWE PRZESUNIĘTE W PRAWO */
        .nav-center { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            gap: 30px; 
        }
        .nav-center a { 
            text-decoration: none; 
            color: var(--text-muted); 
            font-weight: 600; 
            font-size: 0.9rem; 
            transition: 0.3s; 
            position: relative; 
        }
        .nav-center a:hover, .nav-center a.active { color: var(--accent-blue); }
        
        .nav-center a.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        .nav-right { display: flex; justify-content: flex-end; }

        /* DROPDOWN COMMUNITY */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { 
            background: rgba(0, 210, 255, 0.05); 
            color: var(--accent-blue); 
            padding: 9px 18px; 
            border-radius: 6px; 
            border: 1px solid rgba(0, 210, 255, 0.3); 
            cursor: pointer; 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
            font-size: 0.8rem; 
            text-transform: uppercase;
            transition: 0.2s;
        }
        .dropbtn:hover { background: rgba(0, 210, 255, 0.1); border-color: var(--accent-blue); }
        
        .dropdown-content { position: absolute; right: 0; top: 100%; padding-top: 12px; min-width: 220px; opacity: 0; visibility: hidden; transition: 0.25s ease; z-index: 1001; }
        .dropdown-links-wrapper { background: rgba(10, 15, 25, 0.98); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; backdrop-filter: blur(10px); }
        .dropdown-content a { display: flex; justify-content: space-between; align-items: center; color: var(--text-main); padding: 12px 18px; text-decoration: none; font-size: 0.85rem; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .dropdown-content a:hover { color: var(--accent-blue); background: rgba(0, 210, 255, 0.05); }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; }

        /* GŁÓWNY KONTENER TREŚCI */
        .dashboard { width: 100%; max-width: 1400px; padding: 50px; margin: 0 auto; box-sizing: border-box; flex: 1; }

        .section-tag {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-contrast);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-tag::before { content: '///'; color: var(--accent-blue); }

        /* STOPKA */
        footer { 
            max-width: 1400px; 
            width: 100%; 
            margin: 80px auto 40px auto; 
            padding: 40px 50px; 
            border-top: 1px solid var(--border); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem; 
            color: var(--text-muted); 
            font-family: 'JetBrains Mono', monospace; 
            box-sizing: border-box; 
        }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { color: var(--text-muted); transition: 0.2s; }
        .footer-links a:hover { color: var(--accent-blue); }

        @media (max-width: 1024px) { 
            .navbar { grid-template-columns: 1fr; gap: 15px; padding: 20px; text-align: center; }
            .nav-center { justify-content: center; flex-wrap: wrap; gap: 15px; }
            .nav-right { justify-content: center; }
            .dashboard { padding: 30px 20px; }
            footer { flex-direction: column; gap: 20px; text-align: center; padding: 30px 20px; }
            .footer-links { justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="nav-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                DEVLABSTUDY
            </a>
        </div>
        <div class="nav-center">
            <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Hub</a>
            <a href="/blog" {% if page.url contains "blog" %}class="active"{% endif %}>Blog</a>
            <a href="/homelab" {% if page.url contains "homelab" %}class="active"{% endif %}>HomeLab</a>
            <a href="/sponsors" {% if page.url contains "sponsors" %}class="active"{% endif %}>Sponsors</a>
            <a href="/apps" {% if page.url contains "apps" %}class="active"{% endif %}>Apps</a>
            <a href="/kontakt" {% if page.url contains "kontakt" %}class="active"{% endif %}>Kontakt</a>
        </div>
        <div class="nav-right">
            <div class="dropdown">
                <button class="dropbtn">Community ▾</button>
                <div class="dropdown-content">
                    <div class="dropdown-links-wrapper">
                        <a href="https://github.com/DevLabStudy" target="_blank">GitHub <span>↗</span></a>
                        <a href="https://www.youtube.com/channel/UCisFPSU_Y8hznpqrcewcJAg" target="_blank">DevLab YT <span>↗</span></a>
                        <a href="https://www.youtube.com/channel/UCaTfVaE8Pb95CZvblqjNheA" target="_blank">PC Hub YT <span>↗</span></a>
                        <a href="https://discord.gg/uwUTgEQcwj" target="_blank">Discord <span>↗</span></a>
                        <a href="https://www.tiktok.com/@devlabstudy_official" target="_blank">TikTok <span>↗</span></a>
                        <a href="https://www.reddit.com/user/TobiMessi201/" target="_blank">Reddit <span>↗</span></a>
                        <a href="https://x.com/DevLabStudy" target="_blank">X/Twitter <span>↗</span></a>
                        <a href="https://www.instagram.com/devlabstudy" target="_blank">Instagram <span>↗</span></a>
                        <a href="https://pl.pinterest.com/DevLabStudy_Official/" target="_blank">Pinterest <span>↗</span></a>
                        <a href="https://www.facebook.com/devlabstudy" target="_blank">Fanpage <span>↗</span></a>
                        <a href="https://www.linkedin.com/in/tobiaszkajzer" target="_blank">LinkedIn <span>↗</span></a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="dashboard">
        {{ content }}
    </main>

    <footer>
        <div>// SYSTEM_ARCHIVE_2026 — Tobiasz Kajzer</div>
        <div class="footer-links">
            <a href="/polityka-prywatnosci">Polityka Prywatności</a>
            <a href="/regulamin">Regulamin</a>
            <a href="/kontakt">Kontakt</a>
        </div>
    </footer>

</body>
</html>
