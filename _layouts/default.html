<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVLABSTUDY_</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Nowa paleta kolorów */
            --bg-dark: #030305;
            --bg-blue-glow: #0b192c; /* Ciemny błękit do przejść */
            --text-main: #f1f5f9;
            --text-muted: #8b9bb4;
            
            /* Główne akcenty */
            --accent-blue: #00d2ff; /* Jasny błękit */
            --accent-contrast: #ff5e00; /* Kontrujący pomarańczowy na detale */
            
            --border: rgba(0, 210, 255, 0.15);
            --card-bg: rgba(10, 15, 25, 0.6);
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Czerń przechodząca w ciemny błękit */
            background: radial-gradient(circle at top right, var(--bg-blue-glow), var(--bg-dark) 60%);
            background-color: var(--bg-dark);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }

        /* HEADER & NAWIGACJA */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            max-width: 1400px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--accent-contrast);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-contrast);
        }

        .nav-links {
            display: flex;
            gap: 35px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .nav-links a { 
            color: var(--text-muted); 
            transition: 0.3s; 
            position: relative;
        }
        .nav-links a:hover, .nav-links a.active { 
            color: var(--accent-blue); 
        }
        
        /* Delikatna linia pod aktywnym linkiem */
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        /* GŁÓWNY KONTENER */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 50px 60px;
        }

        /* WSPÓLNE ELEMENTY */
        .section-tag {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-contrast);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            display: block;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-tag::before {
            content: '///';
            color: var(--accent-blue);
        }

        /* STOPKA */
        footer {
            max-width: 1300px;
            margin: 80px auto 40px auto;
            padding: 40px 60px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 20px; padding: 20px; }
            .container { padding: 20px; }
            footer { flex-direction: column; gap: 20px; text-align: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">DEVLABSTUDY</a>
        <div class="nav-links">
            <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Hub</a>
            <a href="/blog" {% if page.url contains "blog" %}class="active"{% endif %}>Blog</a>
            <a href="/homelab" {% if page.url contains "homelab" %}class="active"{% endif %}>Homelab</a>
            <a href="/apps" {% if page.url contains "apps" %}class="active"{% endif %}>Aplikacje</a>
            <a href="/kontakt" {% if page.url contains "kontakt" %}class="active"{% endif %}>Kontakt</a>
        </div>
    </nav>

    <main class="container">
        {{ content }}
    </main>

    <footer>
        <div>// SYSTEM_ARCHIVE_2026</div>
        <div>© Tobiasz Kajzer</div>
    </footer>

</body>
</html>
