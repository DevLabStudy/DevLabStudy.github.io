<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevLabStudy - Homelab documentation, Proxmox clusters, and Project Orbit.">
    <title>DevLabStudy | {{ page.title }}</title>
    <link rel="icon" type="image/jpeg" href="/profileIcon_g3ffyg7edeeg1.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #050505; --bg-nav: #050505; --text-main: #f0f0f0; --text-muted: #8b9bb4; --border-color: rgba(255, 255, 255, 0.08); --accent-blue: #3b82f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.015) 1px, transparent 0); background-size: 32px 32px; }

        .navbar { background: var(--bg-nav); border-bottom: 1px solid var(--border-color); padding: 22px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-left { display: flex; align-items: center; }
        .nav-brand { font-size: 1.5rem; font-weight: 900; text-decoration: none; color: #fff; }
        .nav-center { display: flex; justify-content: center; gap: 20px; }
        .nav-center a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .nav-center a:hover, .nav-center a.active { color: var(--accent-blue); }
        
        .dropbtn { background: #111; color: #fff; padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { position: absolute; right: 0; top: 100%; padding-top: 15px; min-width: 200px; opacity: 0; visibility: hidden; transition: 0.2s; }
        .dropdown-links-wrapper { background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; overflow: hidden; }
        .dropdown-content a { display: flex; justify-content: space-between; color: #fff; padding: 12px 16px; text-decoration: none; font-size: 0.85rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .dropdown-content a:hover { color: var(--accent-blue); background: rgba(255, 255, 255, 0.02); }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; }

        .hero-header { max-width: 1000px; margin: 60px auto 40px auto; text-align: center; }
        .hero-title { font-size: 3.5rem; font-weight: 900; margin: 0; color: #fff; }
        .hero-title span { color: var(--accent-blue); }

        .dashboard { width: 100%; max-width: 1200px; padding: 0 40px; margin: 0 auto 40px auto; }
        .grid-container { display: grid; grid-template-columns: 240px 1px 1fr; gap: 50px; }
        .vertical-divider { background: var(--border-color); width: 1px; min-height: 400px; }
        .card { background: rgba(10, 10, 10, 0.7); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; }
        .support-btn { display: block; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; text-align: center; margin-top: 10px; }
        
        @media (max-width: 1024px) { .grid-container { grid-template-columns: 1fr; } .vertical-divider { display: none; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left"><a href="/" class="nav-brand">DevLabStudy</a></div>
        <div class="nav-center">
            <a href="/">Hub</a>
            <a href="/blog">Blog</a>
            <a href="/homelab">HomeLab</a>
            <a href="/orbit">Orbit™</a>
        </div>
        <div class="nav-right">
            <div class="dropdown">
                <button class="dropbtn">Community ▾</button>
                <div class="dropdown-content">
                    <div class="dropdown-links-wrapper">
                        <a href="https://github.com/DevLabStudy" target="_blank">GitHub <span>&#x2197;</span></a>
                        <a href="https://www.youtube.com/@devlabstudy" target="_blank">YouTube <span>&#x2197;</span></a>
                        <a href="https://www.tiktok.com/@devlabstudy" target="_blank">TikTok <span>&#x2197;</span></a>
                        <a href="https://www.instagram.com/devlabstudy" target="_blank">Instagram <span>&#x2197;</span></a>
                        <a href="https://www.reddit.com/user/TobiMessi201/" target="_blank">Reddit <span>&#x2197;</span></a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-header">
        <h1 class="hero-title"><span>{{ page.title }}</span></h1>
    </header>

    <main class="dashboard">
        <div class="grid-container">
            <aside class="left-sidebar">
                <div class="card">
                    <h3 style="font-size: 0.8rem; color: var(--accent-blue); margin: 0 0 10px 0;">Support:</h3>
                    <a href="https://patreon.com/DevLabStudy" target="_blank" class="support-btn" style="background: #e11d48; color: #fff;">PATREON</a>
                </div>
            </aside>
            <div class="vertical-divider"></div>
            <section class="main-content">
                {{ content }}
            </section>
        </div>
    </main>

    <footer class="contact-section" style="margin-top: 60px; padding: 40px;">
        <div class="card" style="border-style: dashed; text-align: center; padding: 40px; background: rgba(10, 10, 10, 0.5);">
            <h3 style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 25px; text-transform: uppercase;">[ Communication_Channels ]</h3>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 60px;">
                <div style="text-align: center;">
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px;">BUSINESS / COLLABORATION</div>
                    <a href="mailto:contact@devlabstudy.ovh" style="color: #fff; font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--accent-blue);">contact@devlabstudy.ovh</a>
                </div>
                <div style="text-align: center;">
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px;">COMMUNITY / SUPPORT</div>
                    <a href="mailto:widzowie@devlabstudy.ovh" style="color: #fff; font-weight: 700; text-decoration: none; border-bottom: 2px solid #64748b;">widzowie@devlabstudy.ovh</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
