---
layout: default
---

<style>
    .post-container {
        max-width: 850px;
        margin: 10px auto 50px auto;
    }

    .back-link {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        color: #ff9900;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 20px;
        font-weight: 700;
    }
    .back-link:hover { text-decoration: underline; }

    .post-header {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(255, 153, 0, 0.25);
        border-radius: 14px;
        padding: 30px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
    }

    .post-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 2rem;
        font-weight: 900;
        color: #fff;
        margin: 0 0 10px 0;
    }

    .post-date {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        color: #ff9900;
        text-transform: uppercase;
    }

    .post-content {
        color: #e2e8f0;
        font-size: 1rem;
        line-height: 1.8;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 30px;
    }
</style>

<div class="post-container">
    <a href="/newsy" class="back-link">← Powrót do Aktualności</a>

    <div class="post-header">
        <div class="post-date">// DATUM: {{ page.date | date: "%Y-%m-%d" }}</div>
        <h1 class="post-title">{{ page.title }}</h1>
    </div>

    <div class="post-content">
        {{ content }}
    </div>
</div>
