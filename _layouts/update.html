<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | DevLabStudy</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #000; 
            color: #f8fafc; 
            margin: 0; 
            line-height: 1.6; 
        }
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 40px; 
            border: 1px solid #333; 
            border-radius: 12px; 
        }
        .article-header { 
            border-bottom: 1px solid #333; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        h1 { margin: 0 0 10px 0; }
        .date { color: #94a3b8; }
        a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <main class="container">
        <header class="article-header">
            <h1>{{ page.title }}</h1>
            <div class="date">{{ page.date | date: "%B %d, %Y" }}</div>
        </header>

        <article>
            {{ content }}
        </article>

        <div style="margin-top: 50px;">
            <a href="/updates">&larr; Wróć do listy aktualizacji</a>
        </div>
    </main>
</body>
</html>
