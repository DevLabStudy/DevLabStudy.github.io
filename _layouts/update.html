<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | DevLabStudy</title>
    <style>
        :root { --bg-nav: rgba(5, 5, 5, 0.85); --text-main: #f8fafc; --text-muted: #94a3b8; --accent-blue: #3b82f6; }
        body { font-family: 'Inter', sans-serif; background: #000; color: var(--text-main); line-height: 1.6; margin: 0; padding: 0; }
        .navbar { padding: 15px 40px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 40px auto; padding: 40px; border: 1px solid #333; border-radius: 12px; }
        .article-header { border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .like-btn { background: #111; border: 1px solid #444; color: #fff; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .like-btn.liked { background: #ef4444; border-color: #ef4444; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" style="color: #fff; font-weight: 800; text-decoration: none;">DevLabStudy</a>
        <a href="/updates" style="color: var(--accent-blue); text-decoration: none;">&larr; Back to Updates</a>
    </nav>

    <main class="container">
        <div class="article-header">
            <h1>{{ page.title }}</h1>
            <div style="color: var(--text-muted);">{{ page.date | date: "%B %d, %Y" }}</div>
        </div>

        <article>
            {{ content }}
        </article>

        <div id="interactionZone" data-post-id="{{ page.id | slugify }}" style="margin-top: 40px; padding-top: 30px; border-top: 1px solid #333;">
            <button class="like-btn" id="likeButton">
                ❤️ <span id="likeText">Polub aktualizację</span> (<span id="postTotalLikes">0</span>)
            </button>
        </div>
    </main>

    <script>
        const API_BASE = "https://api.devlabstudy.pl/api";
        const zone = document.getElementById('interactionZone');
        const postId = zone.getAttribute('data-post-id');
        const likeBtn = document.getElementById('likeButton');
        const likeText = document.getElementById('likeText');
        const likeCount = document.getElementById('postTotalLikes');

        // 1. Pobierz stan początkowy
        fetch(`${API_BASE}/post/${postId}`)
            .then(res => res.json())
            .then(data => {
                likeCount.innerText = data.likes || 0;
            });

        // 2. Sprawdź czy użytkownik polubił wcześniej
        if (localStorage.getItem('liked_' + postId)) {
            likeBtn.classList.add('liked');
            likeText.innerText = 'Polubiono';
        }

        // 3. Akcja kliknięcia
        likeBtn.addEventListener('click', () => {
            const isLiked = likeBtn.classList.contains('liked');
            
            fetch(`${API_BASE}/like/${postId}`, { method: isLiked ? 'DELETE' : 'POST' })
                .then(res => {
                    if (res.ok) {
                        if (isLiked) {
                            likeBtn.classList.remove('liked');
                            likeText.innerText = 'Polub aktualizację';
                            localStorage.removeItem('liked_' + postId);
                            likeCount.innerText = parseInt(likeCount.innerText) - 1;
                        } else {
                            likeBtn.classList.add('liked');
                            likeText.innerText = 'Polubiono';
                            localStorage.setItem('liked_' + postId, true);
                            likeCount.innerText = parseInt(likeCount.innerText) + 1;
                        }
                    }
                });
        });
    </script>
</body>
</html>
