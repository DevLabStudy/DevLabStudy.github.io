<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | DevLabStudy</title>
    
    <link rel="icon" type="image/jpeg" href="/profileIcon_g3ffyg7edeeg1.jpeg">

    <style>
        :root {
            --bg-nav: rgba(5, 5, 5, 0.85); --text-main: #f8fafc; --text-muted: #94a3b8; 
            --border-color: rgba(255, 255, 255, 0.1); --accent-blue: #3b82f6; --bg-card: #111;
        }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; margin: 0; min-height: 100vh;
            background: #000 url('/background.png') no-repeat center center fixed; 
            background-size: cover; color: var(--text-main); overflow-x: hidden;
            line-height: 1.6;
        }

        .navbar { position: sticky; top: 0; z-index: 100; background: var(--bg-nav); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-color); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; }
        .nav-brand { font-size: 1.5rem; font-weight: 800; text-decoration: none; color: var(--text-main); letter-spacing: -0.5px; }
        .back-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; font-size: 0.95rem;}
        .back-link:hover { text-decoration: underline; }

        .container { max-width: 800px; margin: 40px auto; padding: 40px; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid var(--border-color); }
        
        .article-header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        .article-title { font-size: 2.2rem; margin: 0 0 10px 0; line-height: 1.2; font-weight: 800; }
        .article-date { color: var(--text-muted); font-size: 0.95rem; }
        
        .article-content { font-size: 1.1rem; line-height: 1.8; color: #cbd5e1; }
        .article-content h2, .article-content h3 { margin-top: 40px; color: var(--text-main); }
        .article-content a { color: var(--accent-blue); text-decoration: none; }
        .article-content a:hover { text-decoration: underline; }
        .article-content code { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #f8fafc; }
        .article-content pre { background: rgba(0,0,0,0.8); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; overflow-x: auto; }
        .article-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; border: 1px solid var(--border-color); }

        /* ==========================================================================
           NOWE STYLE: Serduszka i Komentarze pod postem
           ========================================================================== */
        .post-interactions {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
        }

        .like-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 35px;
        }
        .like-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .like-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #ef4444;
        }
        .like-btn.liked {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

        .comment-form-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 35px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .form-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 12px;
            color: var(--text-main);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .comments-list {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .single-comment {
            background: rgba(255, 255, 255, 0.01);
            border-left: 3px solid var(--accent-blue);
            border-radius: 0 6px 6px 0;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.02);
            border-right: 1px solid rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .comment-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .comment-text {
            color: #cbd5e1;
        }

        footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 50px 0 30px 0; padding-top: 20px; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="nav-brand">DevLabStudy</a>
        <a href="/blog" class="back-link">&larr; Back to Blog</a>
    </nav>

    <main class="container">
        <header class="article-header">
            <h1 class="article-title">{{ page.title }}</h1>
            <div class="article-date">{{ page.date | date: "%B %d, %Y" }}</div>
        </header>

        <article class="article-content">
            {{ content }}
        </article>

        <div class="post-interactions" data-post-id="{{ page.id | slugify }}">
            
            <div class="like-section">
                <button class="like-btn" id="likeButton">
                    <span>❤️</span> <span id="likeText">Polub wpis</span> (<span id="postTotalLikes">0</span>)
                </button>
            </div>

            <div class="comment-form-card">
                <h3 style="font-size: 1.1rem; margin: 0 0 20px 0;">Dodaj komentarz</h3>
                
                <form id="commentForm">
                    <div class="form-group">
                        <label for="nickname">Twój Nick</label>
                        <input type="text" id="nickname" class="form-input" placeholder="np. anonim" required autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="commentContent">Treść wiadomości</label>
                        <textarea id="commentContent" class="form-input" rows="4" placeholder="Napisz co myślisz..." required></textarea>
                    </div>

                    <div style="display: none !important; visibility: hidden;">
                        <input type="text" id="sys_verification_field" autocomplete="off">
                    </div>

                    <div class="cf-turnstile" data-sitekey="TUTAJ_WPISZ_TWÓJ_SITEKEY_Z_CLOUDFLARE" style="margin-bottom: 15px;"></div>

                    <button type="submit" class="like-btn" style="border-color: var(--accent-blue); color: var(--accent-blue); background: rgba(59, 130, 246, 0.05);">Wyślij komentarz</button>
                </form>
            </div>

            <div class="comments-section">
                <h3 style="font-size: 1.1rem; margin: 0 0 15px 0;">Komentarze (<span id="postTotalComments">0</span>)</h3>
                
                <div class="comments-list" id="commentsList">
                    <div class="single-comment">
                        <div class="comment-meta">Moderacja [System]</div>
                        <div class="comment-text">Komentarze ładują się poprawnie. Brak kont nie przeszkadza w dyskusji!</div>
                    </div>
                </div>
            </div>

        </div>
        </main>

    <footer>
        <p>1 Gbps Fiber - Linux Mint - Orbit™ Project 2026</p>
    </footer>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script>
        // Logika zapisu serduszek w przeglądarce (localStorage)
        document.addEventListener("DOMContentLoaded", function() {
            const postId = document.querySelector('.post-interactions').getAttribute('data-post-id');
            const likeBtn = document.getElementById('likeButton');
            
            if (localStorage.getItem('liked_' + postId)) {
                likeBtn.classList.add('liked');
                document.getElementById('likeText').innerText = 'Polubiono';
            }

            likeBtn.addEventListener('click', function() {
                if (!localStorage.getItem('liked_' + postId)) {
                    localStorage.setItem('liked_' + postId, true);
                    likeBtn.classList.add('liked');
                    document.getElementById('likeText').innerText = 'Polubiono';
                    
                    let currentLikes = parseInt(document.getElementById('postTotalLikes').innerText);
                    document.getElementById('postTotalLikes').innerText = currentLikes + 1;
                    
                    // fetch(`/api/like?id=${postId}`, { method: 'POST' });
                } else {
                    localStorage.removeItem('liked_' + postId);
                    likeBtn.classList.remove('liked');
                    document.getElementById('likeText').innerText = 'Polub wpis';
                    
                    let currentLikes = parseInt(document.getElementById('postTotalLikes').innerText);
                    document.getElementById('postTotalLikes').innerText = currentLikes - 1;
                    
                    // fetch(`/api/unlike?id=${postId}`, { method: 'POST' });
                }
            });
        });
    </script>

</body>
</html>
