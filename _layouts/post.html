---
layout: default
---

<style>
    /* Dedykowane style dla wpisów blogowych */
    .article-header { 
        border-bottom: 1px dashed var(--border, rgba(255, 255, 255, 0.12)); 
        padding-bottom: 25px; 
        margin-bottom: 35px; 
    }

    .article-meta-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
    }

    .article-category {
        color: var(--accent-contrast, #ff5e00);
        font-weight: 800;
        text-transform: uppercase;
        background: rgba(255, 94, 0, 0.1);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid rgba(255, 94, 0, 0.25);
    }

    .article-date { color: var(--text-muted, #94a3b8); }

    .article-title { 
        font-size: 2.3rem; 
        margin: 0; 
        font-weight: 900; 
        letter-spacing: -0.8px;
        line-height: 1.25;
        color: #ffffff;
    }

    .article-content { 
        font-size: 1.05rem; 
        color: #cbd5e1; 
        overflow-wrap: break-word; 
    }

    .article-content p { margin-bottom: 1.6em; }

    .article-content h1, 
    .article-content h2, 
    .article-content h3, 
    .article-content h4 { 
        color: #ffffff; 
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: -0.5px;
        margin-top: 2.2em;
        margin-bottom: 0.8em;
        line-height: 1.3;
    }

    .article-content h2 { 
        font-size: 1.5rem; 
        border-left: 3px solid var(--accent-blue, #00d2ff); 
        padding-left: 14px; 
    }

    .article-content h3 { 
        font-size: 1.25rem; 
        color: var(--accent-blue, #00d2ff); 
    }

    .article-content a { 
        color: var(--accent-blue, #00d2ff); 
        text-decoration: none; 
        font-weight: 600; 
        border-bottom: 1px dashed rgba(0, 210, 255, 0.4);
        transition: 0.2s;
    }

    .article-content pre { 
        max-width: 100%; 
        overflow-x: auto; 
        background: rgba(0, 0, 0, 0.65); 
        border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
        padding: 20px; 
        border-radius: 8px; 
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.9rem;
    }

    .post-interactions {
        margin-top: 50px;
        padding-top: 30px;
        border-top: 1px dashed var(--border, rgba(255, 255, 255, 0.12));
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .kudos-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0, 210, 255, 0.03);
        border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
        padding: 20px 25px;
        border-radius: 10px;
    }

    .kudos-btn {
        background: rgba(255, 94, 0, 0.1);
        border: 1px solid rgba(255, 94, 0, 0.3);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 800;
        cursor: pointer;
    }

    .comments-section {
        background: rgba(3, 3, 5, 0.6);
        border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
        border-radius: 10px;
        padding: 25px;
    }

    .comment-input-group { display: flex; gap: 10px; }
    .comment-input {
        flex: 1;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
        color: #fff;
        padding: 12px 15px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
    }
    .comment-submit {
        background: rgba(0, 210, 255, 0.1);
        border: 1px solid rgba(0, 210, 255, 0.3);
        color: var(--accent-blue, #00d2ff);
        padding: 0 20px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        cursor: pointer;
    }
</style>

<main class="container">
    <header class="article-header">
        <div class="article-meta-bar">
            <span class="article-category">[{{ page.category | default: "SYSTEM" | upcase }}]</span>
            <span class="article-date">// {{ page.date | date: "%Y.%m.%d" }}</span>
        </div>
        <h1 class="article-title">{{ page.title }}</h1>
    </header>

    <article class="article-content">
        {{ content }}
    </article>

    <!-- SEKCJA INTERAKTYWNA -->
    <div class="post-interactions">
        <div class="kudos-box">
            <div class="kudos-info">
                // DOCENIASZ MATERIAŁ? ZOSTAW SYGNAŁ KUDOS.
            </div>
            <button class="kudos-btn" id="kudosBtn">
                ❤️ <span id="kudosCount">0</span> Kudos
            </button>
        </div>

        <div class="comments-section">
            <h3 class="comments-title">Rejestr Komentarzy & Feedback</h3>
            <p class="comments-placeholder">// Masz pytanie lub uwagi do konfiguracji? Zostaw wpis w lokalnym buforze:</p>
            
            <div class="comment-input-group">
                <input type="text" id="commentInput" class="comment-input" placeholder="Wpisz swój komentarz...">
                <button class="comment-submit" id="commentSubmit">Wyślij</button>
            </div>

            <div class="submitted-comments" id="commentsList"></div>
        </div>
    </div>
</main>

<script>
    const postId = window.location.pathname;
    
    // Kudos
    const kudosBtn = document.getElementById('kudosBtn');
    const kudosCountSpan = document.getElementById('kudosCount');
    let kudosKey = 'devlab_kudos_' + postId;
    let likedKey = 'devlab_liked_' + postId;

    let currentKudos = parseInt(localStorage.getItem(kudosKey)) || 0;
    let hasLiked = localStorage.getItem(likedKey) === 'true';

    kudosCountSpan.textContent = currentKudos;
    if(hasLiked) kudosBtn.classList.add('liked');

    kudosBtn.addEventListener('click', () => {
        if(!hasLiked) {
            currentKudos++;
            hasLiked = true;
            kudosBtn.classList.add('liked');
        } else {
            currentKudos = Math.max(0, currentKudos - 1);
            hasLiked = false;
            kudosBtn.classList.remove('liked');
        }
        localStorage.setItem(kudosKey, currentKudos);
        localStorage.setItem(likedKey, hasLiked);
        kudosCountSpan.textContent = currentKudos;
    });

    // Komentarze
    const commentInput = document.getElementById('commentInput');
    const commentSubmit = document.getElementById('commentSubmit');
    const commentsList = document.getElementById('commentsList');

    let commentsKey = 'devlab_comments_' + postId;
    let savedComments = JSON.parse(localStorage.getItem(commentsKey)) || [];

    function renderComments() {
        commentsList.innerHTML = '';
        if(savedComments.length === 0) {
            commentsList.innerHTML = '<div style="color: var(--text-muted, #94a3b8); font-size: 0.85rem; font-family: \'JetBrains Mono\', monospace; margin-top: 10px;">// Brak wpisów w buforze. Bądź pierwszy!</div>';
            return;
        }

        savedComments.forEach((c, index) => {
            const div = document.createElement('div');
            div.className = 'user-comment';
            div.style.cssText = 'background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 6px; margin-top: 10px; display: flex; justify-content: space-between;';
            div.innerHTML = `
                <div>
                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--accent-blue, #00d2ff); margin-bottom: 4px;">// ${c.author} — ${c.date}</div>
                    <div>${escapeHtml(c.text)}</div>
                </div>
            `;
            commentsList.appendChild(div);
        });
    }

    commentSubmit.addEventListener('click', () => {
        const text = commentInput.value.trim();
        if(text.length < 2) return;

        const now = new Date();
        const dateStr = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');

        savedComments.push({ author: "Operator", text: text, date: dateStr });
        localStorage.setItem(commentsKey, JSON.stringify(savedComments));
        commentInput.value = '';
        renderComments();
    });

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace/>/g, "&gt;");
    }

    renderComments();
</script>
