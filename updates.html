---
layout: default
title: Updates
---
<div class="card">
    <h3 style="font-size: 0.8rem; color: var(--text-muted); margin: 0 0 20px 0; text-transform: uppercase; font-family: 'JetBrains Mono', monospace;">[ RECENT_UPDATE_LOGS ]</h3>
    
    <div style="display: flex; flex-direction: column;">
        {% for update in site.updates reversed %}
        <a href="{{ update.url }}" style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); text-decoration: none; color: #fff;">
            <span>{{ update.title }}</span>
            <span style="color: #666; font-family: 'JetBrains Mono';">[{{ update.date | date: "%Y.%m.%d" }}]</span>
        </a>
        {% endfor %}
    </div>
</div>
