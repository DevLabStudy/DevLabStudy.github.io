---
layout: default
title: Updates
---
<div class="card">
    <h3 style="font-size: 0.85rem; color: var(--text-muted); margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace;">[ RECENT_UPDATE_LOGS ]</h3>
    
    <div style="display: flex; flex-direction: column;">
        {% for post in site.posts %}
            {% if post.categories contains 'update' %}
            <a href="{{ post.url }}" class="log-link" style="display: flex; justify-content: space-between; align-items: center; text-decoration: none; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-main); transition: 0.2s;">
                
                <span class="log-title" style="font-size: 0.95rem; font-weight: 600;">{{ post.title }}</span>
                
                <div class="log-meta-wrapper">
                    <span style="color: var(--text-muted); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace;">[{{ post.date | date: "%Y.%m.%d" }}]</span>
                </div>
            </a>
            {% endif %}
        {% endfor %}
    </div>
</div>
